<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Page not found | Your Company Here</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;600&display=swap">
<style>
:root{ --bg:#f5f0e6; --paper:#fcf9f2; --ink:#2b2a28; --ink-soft:#575149; --gold:#b39257; --line:#ddd3bf; }
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Work Sans',sans-serif; font-size:18px; line-height:1.5; }
.demo-banner{ display:block; padding:9px 16px; background:var(--ink); color:#f1eadb; font-size:18px; line-height:1.3; text-align:center; text-decoration:none; }
.demo-banner span{ text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:3px; }
main{ display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 48px); padding:24px 16px; }
.card{ width:100%; max-width:440px; padding:32px 24px; background:var(--paper); border:1px solid var(--line); border-radius:6px; text-align:center; box-shadow:0 26px 50px -22px rgba(43,42,40,.45); }
h1{ margin:0 0 12px; font-family:'Fraunces',serif; font-weight:600; font-size:32px; line-height:1.15; }
p{ margin:0 0 24px; color:var(--ink-soft); }
.btn{ display:flex; align-items:center; justify-content:center; min-height:56px; padding:10px 18px; border:2px solid var(--gold); border-radius:5px; background:var(--gold); color:var(--ink); font-size:20px; font-weight:600; text-decoration:none; }
.btn:hover{ background:#a58648; border-color:#a58648; }
:focus-visible{ outline:3px solid #7f6226; outline-offset:3px; }
</style>
</head>
<body>
<a class="demo-banner" href="https://winchmarketing.co.uk/?r=demo-quote" target="_blank" rel="noopener">Demo quote. Built by <span>Winch Marketing</span></a>
<main>
  <div class="card">
    <h1>Page not found</h1>
    <p>That page doesn't exist. The demo quote is a single page.</p>
    <a class="btn" id="home" href="/">View the demo quote</a>
  </div>
</main>
<script>
/* GitHub Pages serves this file for any unknown address. On a project site (owner.github.io/repo/) the demo lives at the first
   path segment, so point the button there; anywhere else it is the site root. */
(function(){
  var seg = location.pathname.split('/')[1];
  if(/\.github\.io$/i.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
})();
</script>
</body>
</html>
