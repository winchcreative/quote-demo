<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Demo quote | Your Company Here</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A read-only demo of an interactive flip-book quote with e-signature.">
<!-- The demo makes no network requests of its own: only Google Fonts and the pinned signature_pad script are allowed out. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f0e6;          /* warm off-white backdrop */
  --paper:#fcf9f2;       /* the pages */
  --paper-2:#f1eadb;
  --ink:#2b2a28;         /* charcoal */
  --ink-soft:#575149;
  --line:#ddd3bf;
  --gold:#b39257;        /* the one accent: fills, rules, borders */
  --gold-deep:#7f6226;   /* the same gold, dark enough for text on paper */
  --bad:#8c3b2f;         /* error text only */
}
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background:var(--bg); font-family:'Work Sans',sans-serif; font-size:18px; line-height:1.5; color:var(--ink); }
button{ font-family:inherit; }
::selection{ background:var(--gold); color:var(--ink); }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible{ outline:3px solid var(--gold-deep); outline-offset:3px; }

/* ===== demo banner ===== */
.demo-banner{ display:block; padding:9px 16px; background:var(--ink); color:var(--paper-2); font-size:18px; line-height:1.3; text-align:center; text-decoration:none; }
.demo-banner span{ text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:3px; }
.demo-banner:hover span{ color:#fff; }
.demo-banner:focus-visible{ outline-color:var(--gold); outline-offset:-3px; }

/* ===== text logo ===== */
.logo{ display:inline-flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:20px; line-height:1.1; letter-spacing:.01em; }
.logo-mono{ display:inline-grid; place-items:center; flex:none; width:38px; height:38px; border:2px solid var(--gold); font-size:18px; letter-spacing:.04em; }

/* ===== customer stage ===== */
#customer{ min-height:calc(100vh - 48px); display:flex; align-items:center; justify-content:center; padding:20px 12px 40px; }
.stage{ width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:14px; }
.book-wrap{ position:relative; width:100%; aspect-ratio:480/720; }
.spine-shadow{ position:absolute; inset:0; border-radius:6px; box-shadow:0 26px 50px -22px rgba(43,42,40,.45), 0 8px 20px -10px rgba(43,42,40,.3); pointer-events:none; z-index:-1; }
.book-back{ position:absolute; inset:0; background:var(--paper-2); border-radius:6px; }
#book{ width:100%; height:100%; }

/* ===== pages ===== */
.page{ position:relative; height:100%; padding:24px 20px 20px 34px; display:flex; flex-direction:column; overflow:hidden auto; background:var(--paper); color:var(--ink); border-radius:6px; border:1px solid var(--line); font-size:18px; line-height:1.45; }
.page::before{ content:""; position:absolute; top:0; left:0; bottom:0; width:18px; background:linear-gradient(to right, rgba(43,42,40,.13), transparent); z-index:1; pointer-events:none; }
.eyebrow{ margin:0 0 4px; font-family:'IBM Plex Mono',monospace; font-size:18px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-deep); }
h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; }
h2.title{ margin:0 0 14px; font-size:30px; line-height:1.1; color:var(--ink); }
.page p{ margin:0; }
.mono{ font-family:'IBM Plex Mono',monospace; }

/* placeholder pictures: soft gradient with a tile grid, labelled */
.ph{ position:relative; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; height:130px; border:1px solid var(--line); border-radius:4px; overflow:hidden; text-align:center; color:var(--ink-soft);
  background:
    linear-gradient(rgba(255,255,255,.4) 1px, transparent 1px) 0 0/36px 36px,
    linear-gradient(90deg, rgba(255,255,255,.4) 1px, transparent 1px) 0 0/36px 36px,
    linear-gradient(135deg, #ebe2cf, #d3c6a8); }
.ph svg{ width:34px; height:34px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.ph.alt{ background:
    linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px) 0 0/48px 48px,
    linear-gradient(160deg, #e4dccb, #cfc7b6); }

/* cover */
.cover-inner{ position:absolute; inset:0; display:flex; flex-direction:column; gap:14px; padding:24px 20px 22px 42px; }
.cover .ph{ flex:1 1 auto; min-height:90px; height:auto; }
.cover h1{ font-size:clamp(34px,9vw,42px); line-height:1.05; }
.cover .rule{ width:64px; height:3px; background:var(--gold); }
.cover .for{ color:var(--ink-soft); }
.cover .for b{ display:block; color:var(--ink); font-weight:600; }
.cover .meta{ font-family:'IBM Plex Mono',monospace; line-height:1.6; }
.cover .meta b{ font-weight:500; }

/* about / how we work */
.about .ph{ margin-bottom:14px; }
.about p{ color:var(--ink-soft); }
.ticks{ list-style:none; margin:14px 0 0; padding:0; }
.ticks li{ position:relative; padding-left:26px; font-weight:500; }
.ticks li::before{ content:""; position:absolute; left:3px; top:.5em; width:11px; height:6px; border-left:2px solid var(--gold-deep); border-bottom:2px solid var(--gold-deep); transform:rotate(-45deg); }
.steps{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
.steps li{ display:grid; grid-template-columns:38px 1fr; gap:0 12px; align-items:start; }
.steps .n{ grid-row:1 / span 2; display:grid; place-items:center; width:38px; height:38px; border:2px solid var(--gold); border-radius:50%; font-family:'IBM Plex Mono',monospace; font-weight:500; }
.steps .t{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; line-height:1.2; }
.steps .d{ color:var(--ink-soft); line-height:1.35; }

/* quote pages */
.qlist{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.qrow{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.qname{ display:block; font-weight:600; line-height:1.3; }
.qnote{ display:block; color:var(--ink-soft); line-height:1.3; }
.qtotal{ flex:none; font-family:'IBM Plex Mono',monospace; text-align:right; white-space:nowrap; }
.qsub{ display:flex; justify-content:space-between; gap:12px; margin-top:auto; padding-top:12px; font-weight:600; color:var(--gold-deep); }
.qsub .qtotal{ font-weight:500; }
.totals{ font-family:'IBM Plex Mono',monospace; }
.totals div{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); color:var(--ink-soft); }
.totals .grand{ margin-top:6px; padding-top:14px; border:0; border-top:2px solid var(--ink); color:var(--ink); font-weight:500; align-items:baseline; }
.totals .grand span:last-child{ font-family:'Fraunces',serif; font-size:34px; font-weight:600; line-height:1.1; }
.terms{ margin-top:auto; padding-top:14px; color:var(--ink-soft); }

/* service */
.svc h3{ margin:0 0 6px; font-size:20px; color:var(--gold-deep); }
.svc ul{ margin:0 0 14px; padding:0; list-style:none; }
.svc li{ position:relative; padding-left:20px; line-height:1.4; }
.svc li::before{ content:"—"; position:absolute; left:0; color:var(--gold-deep); }
.contact{ margin-top:auto; padding-top:12px; border-top:1px solid var(--line); color:var(--ink-soft); line-height:1.4; }
.contact b{ color:var(--ink); font-weight:600; }

/* decision page. StPageFlip forces inline display:block on the page element mid-flip, which defeats flex-centering on the
   page itself, so the centring is done on this absolutely-positioned inner wrapper, which stays flex regardless. */
.decision-inner{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:24px 20px 20px 34px; overflow-y:auto; }
.decision-inner > :first-child{ margin-top:auto; }
.decision-inner > :last-child{ margin-bottom:auto; }
.decision h2.title{ margin-bottom:8px; }
.decision p.lead{ max-width:34ch; margin:0 0 20px; color:var(--ink-soft); }
.decision-btns{ display:flex; flex-direction:column; gap:14px; width:100%; max-width:380px; }
.dbtn{ width:100%; min-height:56px; padding:10px 18px; border:2px solid var(--gold); border-radius:5px; background:none; color:var(--ink); font-size:19px; font-weight:600; cursor:pointer; }
.dbtn.sign{ background:var(--gold); }
.dbtn.sign:hover{ background:#a58648; border-color:#a58648; }
.dbtn.decline{ border-color:var(--ink); }
.dbtn.decline:hover{ background:var(--ink); color:var(--paper); }
.dbtn:disabled{ opacity:.6; cursor:default; }
.decline-form{ margin-top:18px; width:100%; max-width:380px; }
.decline-form textarea{ display:block; width:100%; min-height:96px; padding:10px 12px; border:2px solid var(--gold); border-radius:5px; background:#fff; color:var(--ink); font-family:'Work Sans',sans-serif; font-size:18px; line-height:1.4; resize:vertical; }
.decline-form .dbtn{ margin-top:10px; }
.decision-error{ margin-top:12px; max-width:34ch; font-weight:600; color:var(--bad); }
.decision-error:empty{ display:none; }
.decided-state{ width:100%; text-align:center; }
.decided-state .badge{ display:inline-block; margin-bottom:12px; padding:6px 16px; border:2px solid var(--gold); border-radius:30px; font-family:'IBM Plex Mono',monospace; font-weight:500; letter-spacing:.04em; }
.decided-state:focus{ outline:none; }
.decided-msg{ max-width:34ch; margin:0 auto; color:var(--ink-soft); }
.decided-msg em{ display:block; margin-top:10px; color:var(--ink); }
.decided-note{ margin-top:18px; color:var(--ink-soft); }
.signed-box{ margin:16px auto 0; width:100%; max-width:340px; }
.signed-card{ padding:14px 14px 12px; border:1px solid var(--line); border-radius:4px; background:linear-gradient(180deg,#fff,var(--paper)); text-align:center; box-shadow:0 10px 22px -12px rgba(43,42,40,.5); }
.signed-stamp{ display:inline-block; margin-bottom:8px; padding:0 14px; border:2px solid var(--gold-deep); border-radius:4px; transform:rotate(-3deg); font-family:'IBM Plex Mono',monospace; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); }
.signed-by, .signed-date{ font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); }
.signed-name{ margin:2px 0; font-family:'Fraunces',serif; font-weight:600; font-size:24px; line-height:1.2; overflow-wrap:anywhere; }
.signed-img{ margin:10px auto 2px; padding:8px; background:#fff; border:1px solid var(--line); border-radius:4px; }
.signed-img img{ display:block; max-width:100%; max-height:100px; margin:0 auto; }

/* ===== controls under the book ===== */
.controls{ display:flex; align-items:center; justify-content:center; gap:12px; width:100%; }
.nav-btn{ flex:1 1 0; max-width:140px; min-height:56px; padding:0 14px; border:2px solid var(--gold); border-radius:5px; background:transparent; color:var(--ink); font-size:18px; font-weight:600; cursor:pointer; }
.nav-btn:hover:not(:disabled){ background:var(--gold); }
.nav-btn:disabled{ opacity:.35; cursor:default; }
.dots{ display:flex; flex:none; gap:5px; }
.dot{ width:8px; height:8px; border-radius:50%; background:var(--line); }
.dot.active{ background:var(--gold-deep); }

/* ===== zoom button and zoom view ===== */
/* Sideways swipes are handled by installSwipe() (one finger, mostly horizontal); the book keeps touch-action:pan-y, so a pinch on the book
   does nothing. Zooming is done with the magnifier button above the book, which opens the zoom view below. */
#custStage .stf__parent, #custStage .page{ touch-action:pan-y; }
.zoom-btn{ align-self:flex-end; display:flex; align-items:center; justify-content:center; width:56px; height:56px; padding:0; border:2px solid var(--gold); border-radius:5px; background:var(--paper); color:var(--ink); cursor:pointer; }
.zoom-btn svg{ width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
.zoom-btn:hover{ background:var(--gold); }
.zv{ position:fixed; inset:0; z-index:9000; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); }
.zv-scroll{ flex:1 1 auto; min-height:0; display:flex; padding:16px; overflow:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y pinch-zoom; }
.zv-scroll:focus-visible{ outline:3px solid var(--gold-deep); outline-offset:-3px; }
.zv-stage{ position:relative; flex:none; margin:auto; }   /* auto margins centre a small page and still let a big one scroll */
.zv-sheet{ position:absolute; left:0; top:0; display:flex; transform-origin:0 0; box-shadow:0 10px 25px -10px rgba(43,42,40,.5); }
.zv-sheet .page{ flex:none; margin:0; overflow:visible; }   /* the copy must not be a scroll box of its own, or it swallows the drag */
.zv-sheet .decision-inner{ overflow:visible; }
.zv-sheet .decision-btns, .zv-sheet .decline-form, .zv-sheet .decision-error, .zv-sheet .dbtn{ display:none; }   /* the buttons only work on the real page */
.zv-bar{ flex:none; display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:2px solid var(--line); background:var(--paper); }
.zv-bar .sg-btn{ width:auto; }
.zv-bar .zv-step{ flex:none; width:56px; padding:0; font-size:30px; line-height:1; }
.zv-bar .zv-close{ flex:1 1 auto; }
.zv-level{ flex:none; min-width:64px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:500; }

/* ===== e-signature dialog: a full-screen page of the book ===== */
.sg-modal{ position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font-size:18px; line-height:1.5; }
.sg-top{ flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 12px 8px 20px; background:var(--ink); color:var(--paper); border-bottom:2px solid var(--gold); }
.sg-x{ flex:none; width:56px; height:56px; border:2px solid var(--gold); border-radius:5px; background:none; color:var(--paper); font-size:32px; line-height:1; cursor:pointer; }
.sg-x:hover:not(:disabled){ background:var(--gold); color:var(--ink); }
.sg-prog{ flex:none; width:100%; max-width:720px; margin:0 auto; padding:14px 20px 0; }
.sg-stepno{ font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); }
.sg-bar{ display:flex; gap:6px; margin-top:8px; }
.sg-bar i{ flex:1; height:6px; border-radius:3px; background:var(--line); }
.sg-bar i.on{ background:var(--gold); }
.sg-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.sg-body{ min-height:100%; display:flex; flex-direction:column; gap:16px; width:100%; max-width:720px; margin:0 auto; padding:14px 20px 20px; }
.sg-step{ display:flex; flex-direction:column; gap:16px; flex:1 1 auto; min-height:0; }
.sg-step[hidden]{ display:none; }
.sg-modal h2{ margin:0; font-size:32px; line-height:1.15; color:var(--ink); }
.sg-modal h2:focus{ outline:none; }
.sg-modal p{ margin:0; font-size:18px; }
.sg-input{ width:100%; min-height:64px; padding:10px 14px; border:2px solid var(--gold); border-radius:5px; background:#fff; color:var(--ink); font-family:inherit; font-size:24px; }
.sg-btn{ width:100%; min-height:56px; padding:10px 18px; border:2px solid var(--gold); border-radius:5px; background:none; color:var(--ink); font-family:inherit; font-size:20px; font-weight:600; cursor:pointer; }
.sg-btn:hover:not(:disabled){ background:var(--paper-2); }
.sg-btn.primary{ background:var(--gold); color:var(--ink); }
.sg-btn.primary:hover:not(:disabled){ background:#a58648; border-color:#a58648; }
.sg-btn:disabled{ opacity:.6; cursor:default; }
.sg-btn-row{ display:flex; gap:12px; }
.sg-btn-row .sg-btn{ flex:1 1 0; }
.sg-link{ align-self:center; min-height:56px; padding:8px 16px; border:0; background:none; color:var(--ink); font-family:inherit; font-size:20px; font-weight:600; text-decoration:underline; cursor:pointer; }
.sg-error{ font-size:18px; font-weight:600; color:var(--bad); }
.sg-error:empty{ display:none; }
.sg-padwrap{ position:relative; flex:1 1 auto; min-height:220px; border:1px solid var(--line); border-radius:6px; background:#fff; box-shadow:0 10px 25px -12px rgba(43,42,40,.5); }
.sg-padwrap canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
.sg-guide{ position:absolute; left:6%; right:6%; bottom:26%; border-bottom:2px solid var(--line); pointer-events:none; }
.sg-guide span{ position:absolute; left:0; bottom:6px; font-size:18px; color:var(--ink-soft); opacity:.6; }
.sg-padwrap.has-ink .sg-guide span{ display:none; }
.sg-review{ padding:4px 16px 10px; border:1px solid var(--line); border-radius:4px; background:linear-gradient(180deg,#fff,var(--paper)); font-family:'IBM Plex Mono',monospace; }
.sg-row{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); color:var(--ink-soft); font-size:18px; }
.sg-row .v{ color:var(--ink); font-size:20px; text-align:right; overflow-wrap:anywhere; }
.sg-row.sig{ flex-direction:column; align-items:flex-start; }
.sg-row.sig img{ display:block; max-width:100%; max-height:150px; }
.sg-row.grand{ border-bottom:none; margin-top:3px; padding-top:12px; color:var(--ink); font-weight:600; }
.sg-row.grand .v{ flex:none; font-size:26px; font-weight:600; white-space:nowrap; }
.sg-check{ display:flex; align-items:center; gap:14px; min-height:64px; padding:12px 14px; border:2px solid var(--gold); border-radius:5px; background:#fff; font-size:20px; font-weight:600; cursor:pointer; }
.sg-check input{ flex:none; width:32px; height:32px; margin:0; accent-color:var(--gold-deep); }
.sg-demo-note{ margin-top:auto; padding-top:8px; color:var(--ink-soft); }
@media (max-height:520px){
  .sg-top{ padding-top:4px; padding-bottom:4px; }
  .sg-prog{ padding-top:8px; }
  .sg-body, .sg-step{ gap:10px; }
  .sg-body{ padding:8px 20px 10px; }
  .sg-modal h2{ font-size:24px; }
  .sg-padwrap{ min-height:120px; }
  #sgS2 > p{ display:none; }   /* the title says it; the room goes to the signing box */
}
@media (prefers-reduced-motion:no-preference){
  .sg-modal, .zv{ animation:sgIn .22s ease-out; }
  .sg-modal.is-closing, .zv.is-closing{ animation:sgOut .18s ease-in forwards; pointer-events:none; }
  .sg-step.is-in{ animation:sgStepIn .25s ease-out; }
}
@keyframes sgIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
@keyframes sgOut{ from{ opacity:1; transform:none; } to{ opacity:0; transform:translateY(14px); } }
@keyframes sgStepIn{ from{ opacity:0; transform:translateX(var(--sg-from,18px)); } to{ opacity:1; transform:none; } }

@media (max-width:640px){
  .page{ padding:22px 16px 18px 30px; }
  .decision-inner{ padding:22px 16px 18px 30px; }
  .cover-inner{ padding:22px 16px 20px 36px; }
  h2.title{ font-size:28px; }
}
</style>
<script src="vendor/page-flip.browser.js"></script>
</head>
<body>

<a class="demo-banner" href="https://winchmarketing.co.uk/?r=demo-quote" target="_blank" rel="noopener">Demo quote. Built by <span>Winch Marketing</span></a>

<div id="customer">
  <div class="stage" id="custStage"></div>
</div>
<noscript><p style="padding:24px;text-align:center">This demo quote needs JavaScript to turn its pages.</p></noscript>

<script>
/* ---------------- demo data ---------------- */
// Everything on screen is made up. Nothing is loaded, saved or sent: reload the page and the demo starts again.
const BRAND = 'Your Company Here';
const VAT_RATE = 0.2;
const VALID_DAYS = 14;
// Money is kept in pence so the totals always add up exactly.
const QUOTE = {
  ref: 'DEMO-001',
  customerName: 'Mr & Mrs Taylor',
  sections: [
    { title: 'Materials', items: [
      { name: 'Bathroom suite',            note: 'Bath, WC and basin',        qty: 1,  unit: 125000 },
      { name: 'Shower and taps',           note: 'Thermostatic, with screen', qty: 1,  unit: 69500 },
      { name: 'Wall and floor tiles',      unitLabel: 'm²',                   qty: 14, unit: 5200 },
      { name: 'Adhesive, grout, sundries', note: '',                          qty: 1,  unit: 19400 }
    ]},
    { title: 'Labour', items: [
      { name: 'Remove old suite',          note: 'Stripped out and taken away', qty: 1,  unit: 38500 },
      { name: 'Fit new suite',             note: 'Plumbing, waste and sealing', qty: 1,  unit: 118000 },
      { name: 'Tiling',                    unitLabel: 'm²',                     qty: 14, unit: 7200 },
      { name: 'Making good and clean',     note: 'Left spotless',               qty: 1,  unit: 22500 }
    ]}
  ]
};
const lineTotal = li => li.qty * li.unit;
const sectionTotal = s => s.items.reduce((t, li) => t + lineTotal(li), 0);
function calcTotals(q){
  const subtotal = q.sections.reduce((t, s) => t + sectionTotal(s), 0);
  const vat = Math.round(subtotal * VAT_RATE);
  return { subtotal, vat, total: subtotal + vat };
}
const money = p => '£' + (p / 100).toLocaleString('en-GB', { minimumFractionDigits:2, maximumFractionDigits:2 });
function escapeHtml(s){

// signature_pad, pinned, loaded from cdnjs the first time the signing dialog opens.
const SIGNATURE_PAD_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js';
const SIGNATURE_PAD_SRI = 'sha384-dPowQo9uxJU703klzvnG+vzLHQDNmO/zREXw6BhCMupB54CE70wj6SWOGVPySK3s';
const SIGNATURE_MAX_WIDTH = 600;        // px width of the PNG
let signaturePadPromise = null;
function loadSignaturePad(){
  if(window.SignaturePad) return Promise.resolve();
  if(signaturePadPromise) return signaturePadPromise;
  signaturePadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = SIGNATURE_PAD_SRC; s.integrity = SIGNATURE_PAD_SRI; s.crossOrigin = 'anonymous';
    s.onload = ()=> window.SignaturePad ? resolve() : (signaturePadPromise = null, reject(new Error('signature_pad missing')));
    s.onerror = ()=>{ signaturePadPromise = null; s.remove(); reject(new Error('signature_pad failed to load')); };
    document.head.appendChild(s);
  });
  return signaturePadPromise;
}

// Keeps the drawing sized to its box. On a rotation or resize the strokes are scaled to fit the new box (never cleared).
function fitSignaturePad(st){
  const rect = st.canvas.parentElement.getBoundingClientRect();
  const w = Math.round(rect.width), h = Math.round(rect.height);
  if(!w || !h || (w === st.w && h === st.h)) return;   // hidden, or nothing changed
  const data = st.pad.toData();
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  st.canvas.width = w * ratio; st.canvas.height = h * ratio;
  st.canvas.getContext('2d').scale(ratio, ratio);
  st.pad.clear();
  if(data.length && st.w){
    const k = Math.min(w / st.w, h / st.h), dx = (w - st.w * k) / 2, dy = (h - st.h * k) / 2;
    data.forEach(g=> g.points.forEach(p=>{ p.x = p.x * k + dx; p.y = p.y * k + dy; }));
    st.pad.fromData(data, { clear:false });
  }
  st.w = w; st.h = h;
  st.wrap.classList.toggle('has-ink', !st.pad.isEmpty());
}
// The drawing as a transparent PNG data URL, cropped to the ink and capped at SIGNATURE_MAX_WIDTH wide.
function signaturePng(st){
  const ratio = st.canvas.width / st.w;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  st.pad.toData().forEach(g=> g.points.forEach(p=>{ x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }));
  const pad = 14, minW = 200, minH = 80;
  let cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = Math.max(x1 - x0 + pad * 2, minW), h = Math.max(y1 - y0 + pad * 2, minH);
  w = Math.min(w, st.w); h = Math.min(h, st.h);
  const left = Math.min(Math.max(cx - w / 2, 0), st.w - w), top = Math.min(Math.max(cy - h / 2, 0), st.h - h);
  const outW = Math.min(SIGNATURE_MAX_WIDTH, Math.round(w * ratio)), outH = Math.max(1, Math.round(outW * h / w));
  const out = document.createElement('canvas'); out.width = outW; out.height = outH;
  out.getContext('2d').drawImage(st.canvas, left * ratio, top * ratio, w * ratio, h * ratio, 0, 0, outW, outH);
  return out.toDataURL('image/png');
}

// The page behind a full-screen dialog is switched off while the dialog is open.
const backdrop = ()=> [document.getElementById('customer'), document.querySelector('.demo-banner')].filter(Boolean);
const setBackdropInert = on=> backdrop().forEach(n=> on ? n.setAttribute('inert', '') : n.removeAttribute('inert'));

let signModal = null;     // the dialog's state while it is open
function openSignModal(){
  if(signModal) return;
  const opener = document.activeElement;
  const root = document.createElement('div');
  root.className = 'sg-modal'; root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-labelledby', 'sgH1');
  root.innerHTML = `
    <div class="sg-top">${LOGO_HTML}
      <button class="sg-x" id="sgClose" type="button" aria-label="Close without signing">&times;</button></div>
    <div class="sg-prog"><div class="sg-stepno" id="sgStepNo" aria-live="polite">Step 1 of 3</div>
      <div class="sg-bar" aria-hidden="true"><i class="on"></i><i></i><i></i></div></div>
    <div class="sg-scroll"><div class="sg-body">
      <section class="sg-step" id="sgS1" aria-labelledby="sgH1">
        <h2 id="sgH1" tabindex="-1">Your name</h2>
        <p id="sgL1">Type your full name below.</p>
        <input class="sg-input" id="sgName" type="text" aria-labelledby="sgH1 sgL1" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="100">
        <div class="sg-error" id="sgE1" role="alert"></div>
        <button class="sg-btn primary" id="sgNext1" type="button">Next</button>
      </section>
      <section class="sg-step" id="sgS2" aria-labelledby="sgH2" hidden>
        <h2 id="sgH2" tabindex="-1">Your signature</h2>
        <p>Sign with your finger in the white box.</p>
        <div class="sg-padwrap" id="sgPadWrap"><canvas id="sgCanvas" role="img" aria-label="Signature box. Draw your signature with your finger or mouse."></canvas><div class="sg-guide" aria-hidden="true"><span>Sign here</span></div></div>
        <div class="sg-error" id="sgE2" role="alert"></div>
        <div class="sg-btn-row"><button class="sg-btn" id="sgClear" type="button">Clear</button><button class="sg-btn primary" id="sgDone" type="button">Done</button></div>
      </section>
      <section class="sg-step" id="sgS3" aria-labelledby="sgH3" hidden>
        <h2 id="sgH3" tabindex="-1">Check and confirm</h2>
        <div class="sg-review">
          <div class="sg-row"><span>Name</span><span class="v" id="sgRevName"></span></div>
          <div class="sg-row sig"><span>Signature</span><img id="sgRevSig" alt="Your signature"></div>
          <div class="sg-row grand"><span>Total (incl. VAT)</span><span class="v">${escapeHtml(money(calcTotals(QUOTE).total))}</span></div>
        </div>
        <label class="sg-check"><input type="checkbox" id="sgTick"><span>I accept this quote and the terms and conditions</span></label>
        <div class="sg-error" id="sgE3" role="alert"></div>
        <button class="sg-btn primary" id="sgConfirm" type="button">Confirm and accept</button>
        <button class="sg-link" id="sgBack" type="button">Go back</button>
      </section>
      <p class="sg-demo-note">This is a demo. Nothing you type or draw here is saved or sent.</p>
    </div></div>`;
  document.body.appendChild(root);
  const $ = id=> root.querySelector('#' + id);
  setBackdropInert(true);
  const prevOverflow = document.documentElement.style.overflow;
  document.documentElement.style.overflow = 'hidden';
  const st = { root, pad:null, canvas:$('sgCanvas'), wrap:$('sgPadWrap'), w:0, h:0, ro:null, name:'', png:'', step:1 };
  signModal = st;

  const showStep = n=>{
    const back = n < st.step;
    st.step = n;
    [1, 2, 3].forEach(i=> { $('sgS' + i).hidden = i !== n; });
    $('sgStepNo').textContent = `Step ${n} of 3`;
    root.querySelectorAll('.sg-bar i').forEach((seg, i)=> seg.classList.toggle('on', i < n));
    const cur = $('sgS' + n);
    cur.style.setProperty('--sg-from', back ? '-18px' : '18px');
    cur.classList.remove('is-in'); void cur.offsetWidth; cur.classList.add('is-in');
    root.setAttribute('aria-labelledby', 'sgH' + n);
    root.querySelector('.sg-scroll').scrollTop = 0;
    if(n === 1) $('sgName').focus(); else $('sgH' + n).focus();
    if(n === 2 && st.pad) fitSignaturePad(st);
  };
  const close = ()=>{
    if(st.ro) st.ro.disconnect();
    signModal = null;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) root.remove();
    else{ root.classList.add('is-closing'); setTimeout(()=> root.remove(), 200); }
    document.removeEventListener('keydown', onKey, true);
    document.documentElement.style.overflow = prevOverflow;
    setBackdropInert(false);
    const back = document.getElementById('signBtn') || opener;
    if(back && back.focus) back.focus();
  };

  // keyboard: Escape closes, Tab stays inside the dialog
  const onKey = e=>{
    if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if(e.key !== 'Tab') return;
    const items = Array.from(root.querySelectorAll('button, input, a[href], [tabindex="0"]')).filter(n=> !n.disabled && n.offsetParent !== null);
    if(!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if(!root.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    else if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', onKey, true);
  // the flipbook listens for touches/mouse on the page underneath: keep the dialog's events to itself
  ['mousedown', 'touchstart', 'pointerdown'].forEach(t=> root.addEventListener(t, e=> e.stopPropagation()));
  $('sgClose').addEventListener('click', close);

  // step 1: name
  const next1 = ()=>{
    const name = $('sgName').value.replace(/\s+/g, ' ').trim();
    if(name.length < 2){ $('sgE1').textContent = 'Please type your full name.'; $('sgName').focus(); return; }
    $('sgE1').textContent = ''; st.name = name;
    showStep(2);
  };
  $('sgNext1').addEventListener('click', next1);
  $('sgName').addEventListener('keydown', e=>{ if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); next1(); } });
  $('sgName').addEventListener('input', ()=>{ $('sgE1').textContent = ''; });

  // step 2: signature (the library loads while they type their name)
  loadSignaturePad().then(()=>{
    if(signModal !== st) return;
    const Pad = window.SignaturePad.default || window.SignaturePad;
    st.pad = new Pad(st.canvas, { penColor:'#000', minWidth:1.5, maxWidth:3.5, backgroundColor:'rgba(0,0,0,0)' });
    st.pad.addEventListener('beginStroke', ()=> { st.wrap.classList.add('has-ink'); $('sgE2').textContent = ''; });
    st.ro = new ResizeObserver(()=> fitSignaturePad(st));
    st.ro.observe(st.wrap);
    fitSignaturePad(st);
  }).catch(()=>{ st.loadFailed = true; });
  $('sgClear').addEventListener('click', ()=>{ if(st.pad) st.pad.clear(); st.wrap.classList.remove('has-ink'); $('sgE2').textContent = ''; });
  $('sgDone').addEventListener('click', ()=>{
    if(!st.pad){
      $('sgE2').textContent = st.loadFailed
        ? "The signing box couldn't load. Please check your connection and try again."
        : 'The signing box is still loading. Please wait a moment and try again.';
      return;
    }
    if(st.pad.isEmpty()){ $('sgE2').textContent = 'Please sign in the white box first.'; return; }
    $('sgE2').textContent = '';
    st.png = signaturePng(st);
    $('sgRevName').textContent = st.name; $('sgRevSig').src = st.png;
    $('sgTick').checked = false; $('sgE3').textContent = '';
    showStep(3);
  });

  // step 3: check and confirm. Nothing is saved: the answer lives in memory until the page is reloaded.
  $('sgBack').addEventListener('click', ()=> showStep(2));
  $('sgTick').addEventListener('change', ()=>{ $('sgE3').textContent = ''; });
  $('sgConfirm').addEventListener('click', ()=>{
    if(!$('sgTick').checked){ $('sgE3').textContent = 'Please tick the box to accept the quote.'; $('sgTick').focus(); return; }
    state.response = { decision:'accepted', name:st.name, signature:st.png, signedAt:new Date().toISOString() };
    close();
    renderDecisionPage();
    const done = document.getElementById('decidedState'); if(done) done.focus();
  });

  showStep(1);
}

/* ---------------- book (StPageFlip) ---------------- */
function wireBook(){
  const bookEl = document.getElementById('book');
  const pages = Array.from(bookEl.querySelectorAll('.page'));
  const total = pages.length;
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = pages.map(()=>'<div class="dot"></div>').join('');
  const dots = Array.from(dotsEl.children);
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const status = document.getElementById('pageStatus');

  const PageFlipCtor = (window.St && window.St.PageFlip) || window.PageFlip;
  const pageFlip = new PageFlipCtor(bookEl, {
    width: 480,
    height: 720,
    size: 'stretch',
    minWidth: 260,
    maxWidth: 700,
    minHeight: 390,
    maxHeight: 1050,
    maxShadowOpacity: 0.5,
    showCover: false,
    usePortrait: true,
    mobileScrollSupport: true
  });
  installSwipe(pageFlip);
  zoomBook = { pageFlip, pages };
  pageFlip.loadFromHTML(pages);

  function updateControls(){
    const idx = pageFlip.getCurrentPageIndex();
    dots.forEach((d,i)=> d.classList.toggle('active', i===idx));
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total-1;
    status.textContent = `Page ${idx + 1} of ${total}`;
  }
  pageFlip.on('flip', updateControls);
  updateControls();

  nextBtn.addEventListener('click', ()=> pageFlip.flipNext());
  prevBtn.addEventListener('click', ()=> pageFlip.flipPrev());
}

/* ---------------- page-turn swipe ---------------- */
// Only a single-finger, mostly horizontal swipe turns a page. A gesture that ever has two or more fingers down (a pinch) and
// any mostly vertical movement (scrolling) are ignored. StPageFlip's own touch handling is cut off in the capture phase, so it
// never sees a touch at all. The Prev / Next buttons and the desktop mouse behave as before.
const SWIPE_MIN_PX = 40;       // a swipe has to travel at least this far sideways...
const SWIPE_MAX_MS = 800;      // ...within this time...
const SWIPE_MAX_SLOPE = 0.5;   // ...and move up or down by no more than half of the sideways distance
let swipePageFlip = null, swipeOn = false;
// StPageFlip also listens for touchmove / touchend on the whole window and calls preventDefault() whenever it thinks a page is mid-turn,
// which stops the zoom view (or the signing dialog) from scrolling. These listeners are registered at load, before the library adds its
// own, so they run first and hide every touch that is not on the book from it.
['touchmove', 'touchend', 'touchcancel'].forEach(t=> window.addEventListener(t, e=>{
  if(!(e.target && e.target.closest && e.target.closest('#book'))) e.stopImmediatePropagation();
}));
function installSwipe(pageFlip){
  swipePageFlip = pageFlip;
  if(swipeOn) return;
  swipeOn = true;
  let g = null;   // the one finger being followed: { id, x, y, t }
  const inBook = e=> !!(e.target && e.target.closest && e.target.closest('#book'));
  window.addEventListener('touchstart', e=>{
    if(!inBook(e)) return;
    e.stopPropagation();
    const t = e.touches.length === 1 ? e.touches[0] : null;   // a second finger ends the gesture for good
    g = t ? { id:t.identifier, x:t.clientX, y:t.clientY, t:Date.now() } : null;
  }, true);
  window.addEventListener('touchmove', e=>{
    if(!inBook(e)) return;
    e.stopPropagation();
    if(e.touches.length > 1) g = null;
  }, true);
  window.addEventListener('touchcancel', e=>{
    if(!inBook(e)) return;
    e.stopPropagation();
    g = null;
  }, true);
  window.addEventListener('touchend', e=>{
    if(!inBook(e)) return;
    e.stopPropagation();
    const start = g; g = null;
    if(!start || e.touches.length) return;
    const t = Array.from(e.changedTouches).find(c=> c.identifier === start.id);
    if(!t) return;
    const dx = t.clientX - start.x, dy = t.clientY - start.y;
    if(Date.now() - start.t > SWIPE_MAX_MS || Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dy) > Math.abs(dx) * SWIPE_MAX_SLOPE) return;
    if(dx < 0) swipePageFlip.flipNext('top'); else swipePageFlip.flipPrev('top');
  }, true);
}

/* ---------------- zoom button and zoom view ---------------- */
// The magnifier above the book (top right) opens the page being read, larger, full screen.
// Inside it the page is scrolled or pinched like any web page and never turns. Close returns to the same page of the flipbook.
const ZOOM_LEVELS = [1, 1.5, 2, 2.5];
const ZOOM_START = 1;     // index into ZOOM_LEVELS: starts at 1.5x
const ZOOM_BTN_HTML = '<button class="zoom-btn" id="zoomBtn" type="button" aria-label="Zoom in on this page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.9-4.9M10.5 7.5v6M7.5 10.5h6"/></svg></button>';
let zoomView = null, zoomBook = null;   // zoomBook: { pageFlip, pages } of the flipbook on screen
function openZoomView(){
  if(zoomView || signModal || !zoomBook) return;
  const { pageFlip, pages } = zoomBook;
  const i = pageFlip.getCurrentPageIndex();
  const shown = [pages[i]].filter(Boolean);   // the book is always one page wide (the stage is at most 480px)
  const opener = document.getElementById('zoomBtn');
  // the pages as they are now, minus what StPageFlip adds to them (position, flip transforms, ids)
  const copies = shown.map(pageEl=>{
    const clone = pageEl.cloneNode(true);
    clone.removeAttribute('style'); clone.removeAttribute('id'); clone.removeAttribute('data-density');
    clone.className = Array.from(pageEl.classList).filter(c=> !/^(stf__|--)/.test(c)).join(' ');
    clone.querySelectorAll('[id]').forEach(n=> n.removeAttribute('id'));
    return { clone, w:pageEl.offsetWidth, h:pageEl.offsetHeight };
  });
  const w = copies.reduce((t, c)=> t + c.w, 0), h = Math.max(...copies.map(c=> c.h));
  if(!w || !h) return;

  const root = document.createElement('div');
  root.className = 'zv'; root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-label', 'Zoomed page');
  root.innerHTML = `
    <div class="sg-top">${LOGO_HTML}</div>
    <div class="zv-scroll" tabindex="0" role="region" aria-label="Zoomed page. Drag to move around."><div class="zv-stage"><div class="zv-sheet"></div></div></div>
    <div class="zv-bar">
      <button class="sg-btn zv-step" id="zvOut" type="button" aria-label="Zoom out">&minus;</button>
      <span class="zv-level" id="zvLevel" role="status"></span>
      <button class="sg-btn zv-step" id="zvIn" type="button" aria-label="Zoom in">+</button>
      <button class="sg-btn primary zv-close" id="zvClose" type="button">Close</button>
    </div>`;
  const $ = id=> root.querySelector('#' + id);
  const scroller = root.querySelector('.zv-scroll'), stage = root.querySelector('.zv-stage'), sheet = root.querySelector('.zv-sheet');
  sheet.style.width = w + 'px';
  copies.forEach(c=>{ c.clone.style.width = c.w + 'px'; sheet.appendChild(c.clone); });
  document.body.appendChild(root);
  const hh = Math.max(h, ...copies.map(c=> c.clone.scrollHeight));   // a long page shows in full (the copy is not a scroll box of its own)
  sheet.style.height = hh + 'px';
  copies.forEach(c=>{ c.clone.style.height = hh + 'px'; });
  setBackdropInert(true);
  const prevOverflow = document.documentElement.style.overflow;
  document.documentElement.style.overflow = 'hidden';
  zoomView = root;

  let level = ZOOM_START;
  const apply = (i, keepCentre)=>{
    const fx = stage.offsetWidth ? (scroller.scrollLeft + scroller.clientWidth / 2) / stage.offsetWidth : .5;
    const fy = stage.offsetHeight ? (scroller.scrollTop + scroller.clientHeight / 2) / stage.offsetHeight : 0;
    level = i;
    const k = ZOOM_LEVELS[i];
    stage.style.width = (w * k) + 'px'; stage.style.height = (hh * k) + 'px';
    sheet.style.transform = `scale(${k})`;
    $('zvOut').disabled = i === 0; $('zvIn').disabled = i === ZOOM_LEVELS.length - 1;
    $('zvLevel').textContent = k + '×';
    if(keepCentre){
      scroller.scrollLeft = fx * stage.offsetWidth - scroller.clientWidth / 2;
      scroller.scrollTop = fy * stage.offsetHeight - scroller.clientHeight / 2;
    }else{
      scroller.scrollLeft = 0; scroller.scrollTop = 0;   // opens at the top left of the page
    }
  };
  apply(level, false);

  const close = ()=>{
    document.removeEventListener('keydown', onKey, true);
    zoomView = null;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) root.remove();
    else{ root.classList.add('is-closing'); setTimeout(()=> root.remove(), 200); }
    document.documentElement.style.overflow = prevOverflow;
    setBackdropInert(false);
    if(opener && opener.isConnected) opener.focus();
  };
  // keyboard: Escape closes, Tab stays inside the zoom view
  const onKey = e=>{
    if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if(e.key !== 'Tab') return;
    const items = Array.from(root.querySelectorAll('button, a[href], [tabindex="0"]')).filter(n=> !n.disabled && n.offsetParent !== null);
    if(!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if(!root.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    else if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', onKey, true);
  $('zvClose').addEventListener('click', close);
  $('zvIn').addEventListener('click', ()=>{ if(level < ZOOM_LEVELS.length - 1) apply(level + 1, true); });
  $('zvOut').addEventListener('click', ()=>{ if(level > 0) apply(level - 1, true); });
  scroller.focus();
}

renderQuote();
</script>
</body>
</html>
